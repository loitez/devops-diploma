name: Diploma CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_KEY }}

      - name: Build and Push Docker Image
        run: |
          docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/diploma-app:${{ github.sha }} .
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/diploma-app:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install YC CLI and Helm
        run: |
          # Установка YC через официальный репозиторий
          curl -sSL https://yandexcloud.net | bash -s -- -n
          # Установка Helm
          curl https://githubusercontent.com | bash

      - name: Deploy
        run: |
          # Явно указываем путь к yc в этой команде
          export YC_PATH=$HOME/yandex-cloud/bin/yc
          
          # Настройка авторизации
          echo '${{ secrets.YC_SA_JSON_KEY }}' > sa-key.json
          $YC_PATH config profile create sa-profile
          $YC_PATH config set service-account-key sa-key.json
          
          # Получение конфига и деплой
          $YC_PATH managed-kubernetes cluster get-credentials ${{ secrets.YC_K8S_CLUSTER_ID }} --external
          
          helm upgrade --install my-release ./my-app-chart \
            --set image=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/diploma-app:${{ github.sha }}
